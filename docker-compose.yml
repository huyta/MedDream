services:
  # ==========================================
  # 1. PostgreSQL Database (RIS Storage)
  # ==========================================
  postgres:
    image: postgres:17-alpine
    container_name: meddream-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ris_db
      POSTGRES_USER: ris_user
      POSTGRES_PASSWORD: ris_password
    volumes:
      - ris-postgres-data:/var/lib/postgresql/data
    networks:
      - pacs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ris_user -d ris_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ==========================================
  # 2. .NET Core RIS Web API
  # ==========================================
  ris-api:
    build:
      context: ./ris-api
      dockerfile: Dockerfile
    container_name: ris-core-api
    restart: unless-stopped
    ports:
      - "5000:8080"        # Exposes REST API & Swagger UI on host port 5000
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=ris_db;Username=ris_user;Password=ris_password"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pacs-network

  # ==========================================
  # 3. Orthanc PACS (with Python MWL Plugin)
  # ==========================================
  orthanc:
    build:
      context: .
      dockerfile: Dockerfile.orthanc-mwl
    image: meddream-orthanc-mwl:latest
    container_name: meddream-orthanc
    restart: unless-stopped
    ports:
      - "${ORTHANC_DICOM_PORT:-4242}:4242"   # DICOM DIMSE Port (C-STORE, C-FIND, C-MOVE)
      - "${ORTHANC_HTTP_PORT:-8042}:8042"     # Orthanc REST API & Web Explorer
    environment:
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: '{"orthanc":"orthanc"}'
      DICOM_WEB__ENABLE: "true"
      DICOM_WEB__ENABLE_WADO: "true"
      RIS_API_URL: "${RIS_API_URL:-http://ris-api:8080/api/worklist}"
    volumes:
      - ./config/orthanc.json:/etc/orthanc/orthanc.json:ro
      - ./config/worklist_plugin.py:/etc/orthanc/worklist_plugin.py:ro
      - ./worklists:/var/lib/orthanc/worklists
      - orthanc-data:/var/lib/orthanc/db
    depends_on:
      - ris-api
    networks:
      - pacs-network
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request, base64; req = urllib.request.Request(\"http://localhost:8042/system\"); req.add_header(\"Authorization\", \"Basic \" + base64.b64encode(b\"orthanc:orthanc\").decode()); exit(0 if urllib.request.urlopen(req).status == 200 else 1)'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ==========================================
  # 4. MedDream DICOM Viewer Web Application
  # ==========================================
  meddream:
    image: meddream/orthanc-dicom-viewer:8.10.0-rc.10
    container_name: meddream-viewer
    restart: unless-stopped
    ports:
      - "${MEDDREAM_PORT:-8080}:8080"        # MedDream Web Viewer UI & API
    volumes:
      - ./config/application.properties:/opt/meddream/application.properties:ro
      - ./license:/opt/meddream/license      # License directory for .lic / license files
    depends_on:
      orthanc:
        condition: service_healthy
    networks:
      - pacs-network
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; s = socket.socket(); s.settimeout(2); s.connect((\"127.0.0.1\", 8080)); s.close()'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

# ==========================================
# Persistent Storage Volumes
# ==========================================
volumes:
  orthanc-data:
    name: meddream_orthanc_data
  ris-postgres-data:
    name: meddream_ris_postgres_data

# ==========================================
# Internal Network
# ==========================================
networks:
  pacs-network:
    name: meddream_pacs_net
    driver: bridge
