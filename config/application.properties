# ==========================================
# MedDream DICOM Viewer Configuration
# ==========================================

# Server Port & Logging
server.port=8080
server.servlet.session.timeout=120
logging.file.name=mdjavacore
logging.level.root=INFO
logging.level.com.softneta=INFO

# License and Login
com.softneta.license.licenseFileLocation=./license
com.softneta.meddream.loginEnabled=true

# Direct URL / Study Integration (Bypasses Login Prompt)
# Supported parameter keys: study, patient, accnum, file, storage
authentication.his.valid-his-params=study,patient,accnum
authentication.his.useSameSession=true
security.postMessageWhitelist=*
authentication.his.maxObjects=4

# Auth profiles
spring.profiles.include=auth-inmemory,auth-his
authentication.inmemory.users[0].userName=demo
authentication.inmemory.users[0].password=demo
authorization.users[0].userName=demo
authorization.users[0].role=SEARCH,EXPORT_ISO,EXPORT_ARCH,FORWARD,REPORT_VIEW,REPORT_UPLOAD,PATIENT_HISTORY,UPLOAD_DICOM_LIBRARY,DOCUMENT_VIEW,ADMIN
authorization.defaultHisPermissions=SEARCH,EXPORT_ISO,EXPORT_ARCH,FORWARD,REPORT_VIEW,REPORT_UPLOAD,PATIENT_HISTORY,UPLOAD_DICOM_LIBRARY,DOCUMENT_VIEW,ADMIN
authorization.defaultLoginPermissions=SEARCH,DOCUMENT_VIEW,EXPORT_ISO,EXPORT_ARCH,FORWARD,REPORT_VIEW,REPORT_UPLOAD,PATIENT_HISTORY,UPLOAD_DICOM_LIBRARY,ADMIN

# PACS Integration: Orthanc Connection
com.softneta.meddream.pacs.configurations[0].type=Orthanc
com.softneta.meddream.pacs.configurations[0].id=PACS
com.softneta.meddream.pacs.configurations[0].baseUrl=http://orthanc:8042
com.softneta.meddream.pacs.configurations[0].username=orthanc
com.softneta.meddream.pacs.configurations[0].password=orthanc
com.softneta.meddream.pacs.configurations[0].storeScpAet=ORTHANC
com.softneta.meddream.pacs.configurations[0].storeScpIp=orthanc
com.softneta.meddream.pacs.configurations[0].storeScpPort=4242
com.softneta.meddream.pacs.configurations[0].storeScuAet=MEDDREAM
com.softneta.meddream.pacs.configurations[0].pythonPlugin=false
